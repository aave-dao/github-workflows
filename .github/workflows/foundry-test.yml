name: foundry test

on:
  workflow_call:
    inputs:
      mode:
        default: "ALL"
        type: "string"
      compareGas:
        default: true
        type: boolean
      compareLcov:
        default: true
        type: boolean
      compareSize:
        default: true
        type: boolean
    secrets:
      ALCHEMY_API_KEY:
        required: false
      QUICKNODE_TOKEN:
        required: false
      QUICKNODE_ENDPOINT_NAME:
        required: false

jobs:
  test:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      ### Setup ###
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ github.token }}

      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - uses: aave-dao/action-rpc-env@5191193b0de7443bda94b6f42092c83e32464adc
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          QUICKNODE_TOKEN: ${{ secrets.QUICKNODE_TOKEN }}
          QUICKNODE_ENDPOINT_NAME: ${{ secrets.QUICKNODE_ENDPOINT_NAME }}

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main

      ### Ensure contract size is not exceeded ###
      - name: Run Forge size
        if: ${{ inputs.compareSize }}
        uses: aave-dao/github-workflows/.github/actions/foundry-size@main
        continue-on-error: true

      - name: Run Gas report
        if: ${{ inputs.compareGas }}
        uses: aave-dao/github-workflows/.github/actions/foundry-gas-report@main
        continue-on-error: true

      ### Run tests ###
      - name: Run Forge tests
        id: test
        uses: aave-dao/github-workflows/.github/actions/foundry-test@main
        with:
          MODE: ${{ inputs.mode }}

      ### Extended reports ###
      - name: Run Lcov report
        if: ${{ inputs.compareLcov }}
        uses: aave-dao/github-workflows/.github/actions/foundry-lcov-report@main

      - name: Upload & Trigger Comment artifact
        if: always()
        uses: aave-dao/github-workflows/.github/actions/comment-artifact@main
        with:
          nameSuffix: "default"
