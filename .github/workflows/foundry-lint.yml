name: Foundry Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main

      - name: lint
        run: forge fmt --check
